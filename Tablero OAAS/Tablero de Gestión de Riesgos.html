<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Riesgos de Desastres</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #f4f9f5;
            --cube-bg: rgba(255, 255, 255, 0.92);
            --cube-border: #bbf7d0;
            --cube-side-r: #d1fae5;
            --cube-side-b: #a7f3d0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #e6f4ea 0%, var(--bg-cream) 55%, #eef7f2 100%);
            color: #064e3b;
            min-height: 100vh;
        }
        .pyramid-cube {
            position: relative;
            background: var(--cube-bg);
            border: 1.5px solid var(--cube-border);
            box-shadow: 0 8px 20px -6px rgba(6, 78, 59, 0.08);
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }
        .pyramid-cube::before,
        .pyramid-cube::after {
            content: '';
            position: absolute;
            pointer-events: none;
            transition: all 0.22s ease;
        }
        .pyramid-cube::before {
            top: 6px;
            right: -7px;
            width: 7px;
            height: calc(100% - 6px);
            background: var(--cube-side-r);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            transform: skewY(45deg);
        }
        .pyramid-cube::after {
            bottom: -7px;
            left: 6px;
            width: calc(100% - 6px);
            height: 7px;
            background: var(--cube-side-b);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            transform: skewX(45deg);
        }
        .pyramid-cube:hover {
            transform: translate(-3px, -3px);
            border-color: #6ee7b7;
            box-shadow: 0 14px 26px -8px rgba(6, 78, 59, 0.14);
            z-index: 30;
        }
        .responsable-tooltip {
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 6px);
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .pyramid-cube:hover .responsable-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body class="pb-16 selection:bg-emerald-200 selection:text-emerald-950">

    <!-- ================= VISTA PRINCIPAL ================= -->
    <div id="mainPyramidWindow" class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 transition-all">
        <header class="flex flex-col gap-5 pb-6 border-b border-emerald-200/80">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-300 to-sky-300 border border-emerald-400/50 flex items-center justify-center shadow-md shadow-emerald-700/10 shrink-0">
                    <i class="ph-fill ph-mountains text-3xl text-emerald-950"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-emerald-950">Gestión de Riesgos de Desastres</h1>
                    <p class="text-sm text-emerald-800/80 font-medium">Seguimiento piramidal de productos ambientales, avance esperado al día de hoy y progreso completado</p>
                </div>
            </div>
            <!-- Información de Progreso General debajo del título -->
            <div id="generalProgressHeader" class="w-full"></div>
        </header>

        <!-- Barra de Filtros Interactivos -->
        <section class="mt-6 flex items-center justify-center bg-white/75 backdrop-blur-md p-3.5 rounded-2xl border border-emerald-200/90 shadow-sm">
            <div class="flex flex-wrap items-center justify-center gap-3 w-full" id="filterButtonsContainer"></div>
        </section>

        <!-- Leyenda de Barras -->
        <div class="mt-4 flex justify-end gap-5 px-2 text-xs text-emerald-900/80 font-semibold">
            <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-sky-400 inline-block"></span> Progreso Esperado</span>
            <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span> Progreso Completado</span>
        </div>

        <!-- Estado de Carga -->
        <div id="loadingState" class="py-20 flex flex-col items-center justify-center gap-3 text-emerald-800">
            <i class="ph ph-spinner-gap animate-spin text-4xl text-emerald-600"></i>
            <p class="text-sm font-semibold">Cargando productos del tablero...</p>
        </div>

        <!-- Contenedor de la Pirámide -->
        <main id="pyramidContainer" class="hidden flex-col items-center mt-2 pb-12"></main>
    </div>

    <!-- ================= VENTANA DETALLE PIRAMIDAL ================= -->
    <div id="detailPyramidWindow" class="hidden relative z-20 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-16">
        <div class="mb-6 flex items-center justify-between bg-white/85 backdrop-blur-md px-5 py-3.5 rounded-2xl border border-emerald-200 shadow-sm">
            <button onclick="toggleWindows(false)" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-950 font-bold text-xs sm:text-sm transition-all shadow-sm">
                <i class="ph-bold ph-arrow-left"></i> Volver a la Pirámide Principal
            </button>
            <span class="text-xs font-bold text-emerald-800 uppercase tracking-wider">Detalle Piramidal del Producto</span>
        </div>
        <div id="detailPyramidContent" class="flex flex-col items-center gap-6"></div>
    </div>

    <script>
        const SHEET_XLSX_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNF_xUz3xN-BvgUgSMy3BI593nGnvyTID5Eq56WklQtaLj6Go9as6-OYh2yC0yzg/pub?output=xlsx';

        let productsData = [];
        let columnHeaders = [];
        let currentFilter = 'piramidal';

        const DOM = {
            main: document.getElementById('mainPyramidWindow'),
            detail: document.getElementById('detailPyramidWindow'),
            content: document.getElementById('detailPyramidContent'),
            pyramid: document.getElementById('pyramidContainer'),
            loading: document.getElementById('loadingState'),
            filters: document.getElementById('filterButtonsContainer'),
            generalHeader: document.getElementById('generalProgressHeader')
        };

        const filterBtns = [
            { id: 'piramidal', icon: 'ph-triangle', text: '1. Vista Piramidal' },
            { id: 'vencimientos', icon: 'ph-clock-countdown', text: '2. Próximos Vencimientos' },
            { id: 'avance', icon: 'ph-trend-up', text: '3. Mayor Avance' },
            { id: 'rezago', icon: 'ph-chart-bar-horizontal', text: '4. Mayor Rezago' }
        ];

        // --- Utilidades de Texto y Fechas ---
        const toTitleCase = str => {
            if (!str) return 'Sin asignar';
            return String(str)
                .toLowerCase()
                .replace(/(?:^|\s|-|\/|,)\S/g, m => m.toUpperCase());
        };

        const generateReferent = (fullName, code) => {
            if (!fullName) return `Producto ${code || ''}`;
            const clean = String(fullName).replace(/\s+/g, ' ').trim();
            if (clean.length <= 52) return clean;
            const stopWords = new Set(['de', 'del', 'la', 'las', 'el', 'los', 'en', 'y', 'o', 'para', 'por', 'con', 'un', 'una', 'al']);
            const words = clean.split(' ').filter(w => !stopWords.has(w.toLowerCase()));
            const shortText = words.slice(0, 6).join(' ');
            return shortText.length > 55 ? shortText.slice(0, 52) + '...' : shortText;
        };

        const parseExcelDate = val => {
            if (!val && val !== 0) return null;
            if (val instanceof Date && !isNaN(val)) return val;
            if (typeof val === 'number') {
                const utcDays = Math.floor(val - 25569);
                return new Date(utcDays * 86400 * 1000);
            }
            const str = String(val).trim();
            const dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
            if (dmy) {
                const y = dmy[3].length === 2 ? 2000 + +dmy[3] : +dmy[3];
                return new Date(y, +dmy[2] - 1, +dmy[1]);
            }
            const parsed = new Date(str);
            return isNaN(parsed) ? null : parsed;
        };

        const formatDateDisplay = date => {
            if (!date || isNaN(date)) return 'S/F';
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}/${m}/${y}`;
        };

        const parsePct = val => {
            if (val === null || val === undefined || String(val).trim() === '') return 0;
            if (typeof val === 'number') return +(val <= 1 && val > 0 ? val * 100 : val).toFixed(1);
            const num = parseFloat(String(val).replace('%', '').replace(',', '.').trim());
            return isNaN(num) ? 0 : +Math.min(100, Math.max(0, num)).toFixed(1);
        };

        const calcExpected = (start, end, today = new Date()) => {
            if (!start || !end || isNaN(start) || isNaN(end)) return 0;
            if (today <= start) return 0;
            if (today >= end) return 100;
            const total = end.getTime() - start.getTime();
            if (total <= 0) return 100;
            return +Math.min(100, Math.max(0, ((today.getTime() - start.getTime()) / total) * 100)).toFixed(1);
        };

        // --- Barras de Progreso ---
        const renderProgressBar = (label, pct, color = 'emerald') => {
            const barColor = color === 'sky' ? 'bg-sky-400' : 'bg-emerald-400';
            const textColor = color === 'sky' ? 'text-sky-900' : 'text-emerald-900';
            return `
                <div>
                    <div class="flex justify-between text-[11px] font-bold ${textColor} mb-1">
                        <span>${label}</span>
                        <span>${pct}%</span>
                    </div>
                    <div class="w-full h-2.5 bg-emerald-100/80 rounded-full overflow-hidden border border-emerald-200/60">
                        <div class="h-full ${barColor} rounded-full transition-all duration-500" style="width: ${Math.min(100, Math.max(0, pct))}%"></div>
                    </div>
                </div>`;
        };

        // --- Botones de Filtro ---
        const renderFilters = () => {
            DOM.filters.innerHTML = filterBtns.map(b => {
                const active = currentFilter === b.id;
                const cls = active
                    ? 'bg-emerald-700 text-white border-emerald-800 shadow-md scale-[1.02]'
                    : 'bg-emerald-50/90 text-emerald-900 border-emerald-200 hover:bg-emerald-100';
                return `
                    <button onclick="setFilter('${b.id}')" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center gap-2 ${cls}">
                        <i class="ph-bold ${b.icon}"></i>
                        <span>${b.text}</span>
                    </button>`;
            }).join('');
        };

        window.setFilter = id => {
            currentFilter = id;
            renderFilters();
            renderPyramid();
        };

        // --- Carga del Archivo XLSX ---
        async function loadSpreadsheetData() {
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 8000);
                const response = await fetch(SHEET_XLSX_URL, { signal: controller.signal });
                clearTimeout(timer);
                if (!response.ok) throw new Error('Error de red al descargar XLSX');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
                processRows(rows);
            } catch (err) {
                console.warn('Usando datos de respaldo locales:', err);
                useFallbackData();
            }
        }

        function processRows(rows) {
            if (!rows || rows.length < 2) {
                useFallbackData();
                return;
            }
            columnHeaders = rows[0].slice(0, 11).map((h, i) => String(h || `Atributo ${i + 1}`).trim());
            const dataRows = rows.slice(1).filter(r => r && (String(r[0] || '').trim() !== '' || String(r[1] || '').trim() !== ''));

            if (!dataRows.length) {
                useFallbackData();
                return;
            }

            productsData = dataRows.map((r, idx) => {
                const code = String(r[0] || `P-${idx + 1}`).trim();
                const fullName = String(r[1] || 'Producto sin descripción').trim();
                const responsable = toTitleCase(r[2] || 'Sin asignar');
                const startDate = parseExcelDate(r[4]);
                const endDate = parseExcelDate(r[5]);
                const completedPct = parsePct(r[9]);

                return {
                    originalIndex: idx,
                    code,
                    fullName,
                    referent: generateReferent(fullName, code),
                    responsable,
                    startDate,
                    endDate,
                    completedPct,
                    rawRow: r.slice(0, 11)
                };
            });

            renderData();
        }

        function useFallbackData() {
            columnHeaders = [
                'Código', 'Producto', 'Responsable', 'Entidad / Área', 'Fecha Inicio',
                'Fecha Fin', 'Indicador', 'Meta', 'Estado', '% Completado', 'Observaciones'
            ];
            const sample = [
                ['GRD-01', 'Actualización del Plan Municipal de Gestión del Riesgo de Desastres y Estrategia de Respuesta', 'carlos andres perez / maria fernanda gomez', 'Gestión Ambiental', '15/01/2025', '30/06/2025', 'Documento actualizado', '1', 'En ejecución', '', 'Revisión técnica'],
                ['GRD-02', 'Sistema de Alerta Temprana Hidrometeorológica en Cuencas Priorizadas de Alta Pendiente', 'luisa fernanda martinez', 'Hidrología y Clima', '01/02/2025', '15/08/2025', 'Estaciones operativas', '4', 'En ejecución', '', 'Instalación de sensores'],
                ['GRD-03', 'Zonificación de Amenaza, Vulnerabilidad y Riesgo por Movimientos en Masa e Inundaciones', 'jorge eliécer ramirez / diana carolina soto', 'Ordenamiento Territorial', '10/01/2025', '20/05/2025', 'Mapa oficial', '1', 'En ejecución', '', 'Trabajo de campo'],
                ['GRD-04', 'Obras de Bioingeniería y Restauración Ecológica en Rondas Hídricas Críticas', 'andrea paola vargas', 'Restauración Ambiental', '01/03/2025', '30/10/2025', 'Hectáreas intervenidas', '25', 'En ejecución', '', 'Viveros comunitarios'],
                ['GRD-05', 'Programa de Capacitación Comunitaria y Simulacros ante Emergencias Ambientales', 'diego alejandro castro', 'Participación Social', '15/02/2025', '30/09/2025', 'Jornadas realizadas', '12', 'En ejecución', '', 'Con juntas comunales'],
                ['GRD-06', 'Protocolo Interinstitucional de Atención de Incendios Forestales y Sequías Estacionales', 'claudia patricia rodriguez', 'Manejo de Desastres', '01/01/2025', '30/04/2025', 'Protocolo adoptado', '1', 'En ejecución', '', 'Coordinación bomberos']
            ];
            processRows([columnHeaders, ...sample]);
        }

        // --- Cálculos MS Project y Renderizado ---
        const getGeneralMetrics = () => {
            if (!productsData.length) return { exp: 0, comp: 0, start: null, end: null, total: 0 };
            let totalWeight = 0;
            let weightedExp = 0;
            let sumComp = 0;
            let minStart = null;
            let maxEnd = null;

            productsData.forEach(p => {
                sumComp += p.completedPct;
                if (p.startDate && (!minStart || p.startDate < minStart)) minStart = p.startDate;
                if (p.endDate && (!maxEnd || p.endDate > maxEnd)) maxEnd = p.endDate;

                const durationDays = (p.startDate && p.endDate)
                    ? Math.max(1, Math.round((p.endDate - p.startDate) / 86400000))
                    : 1;
                totalWeight += durationDays;
                weightedExp += p.expectedPct * durationDays;
            });

            return {
                exp: totalWeight ? +(weightedExp / totalWeight).toFixed(1) : 0,
                comp: +(sumComp / productsData.length).toFixed(1),
                start: minStart,
                end: maxEnd,
                total: productsData.length
            };
        };

        const renderData = () => {
            const today = new Date();
            productsData.forEach(p => {
                p.isComplete = p.completedPct >= 100;
                p.expectedPct = calcExpected(p.startDate, p.endDate, today);
                p.lag = p.isComplete ? 0 : Math.max(0, +(p.expectedPct - p.completedPct).toFixed(1));
            });
            renderPyramid();
        };

        function renderPyramid() {
            DOM.loading.classList.add('hidden');
            DOM.pyramid.classList.remove('hidden');
            DOM.pyramid.classList.add('flex');

            const filtered = [...productsData].sort((a, b) => {
                if (currentFilter === 'piramidal') return a.originalIndex - b.originalIndex;
                if (currentFilter === 'avance') {
                    return b.completedPct !== a.completedPct ? b.completedPct - a.completedPct : b.expectedPct - a.expectedPct;
                }
                if (a.isComplete !== b.isComplete) return a.isComplete ? 1 : -1;
                if (currentFilter === 'vencimientos') {
                    return (a.endDate || new Date(9e14)) - (b.endDate || new Date(9e14));
                }
                return b.lag !== a.lag ? b.lag - a.lag : b.expectedPct - a.expectedPct;
            });

            const m = getGeneralMetrics();
            const lag = Math.max(0, +(m.exp - m.comp).toFixed(1));

            DOM.generalHeader.innerHTML = `
                <div class="bg-white/85 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-emerald-200/90 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    <div class="space-y-1">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold bg-emerald-100 text-emerald-900 border border-emerald-300">PROGRESO GENERAL (${m.total} PRODUCTOS)</span>
                            <span class="text-xs text-emerald-800 font-semibold bg-emerald-50/80 px-2.5 py-0.5 rounded-lg border border-emerald-200">
                                <i class="ph-fill ph-calendar-blank"></i> ${formatDateDisplay(m.start)} — ${formatDateDisplay(m.end)}
                            </span>
                        </div>
                        <p class="text-xs text-emerald-900 font-medium pt-1">
                            Diferencia consolidada: <strong class="text-emerald-800">${lag > 0 ? '-' + lag : '0'}%</strong>
                        </p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1 max-w-2xl bg-emerald-50/50 p-3 rounded-xl border border-emerald-200/70">
                        ${renderProgressBar('Progreso Esperado General', m.exp, 'sky')}
                        ${renderProgressBar('Progreso Completado General', m.comp, 'emerald')}
                    </div>
                </div>`;

            let html = '';
            if (!filtered.length) {
                html = `<div class="py-12 text-center bg-white/80 border rounded-2xl px-8 w-full max-w-lg mt-4"><p class="text-sm font-semibold">Sin productos disponibles.</p></div>`;
            } else {
                for (let i = 0, cap = 1; i < filtered.length; i += cap, cap++) {
                    html += `<div class="w-full flex justify-center gap-4 mt-3 flex-wrap">` +
                        filtered.slice(i, i + cap).map(cubeHTML).join('') +
                        `</div>`;
                }
            }
            DOM.pyramid.innerHTML = html;
        }

        const cubeHTML = item => `
            <div onclick="openProductWindow(${item.originalIndex})" class="pyramid-cube w-full sm:w-72 rounded-2xl p-4 cursor-pointer flex flex-col justify-between group min-h-[215px]">
                <div class="responsable-tooltip absolute -top-14 left-1/2 -translate-x-1/2 z-40 w-max max-w-[260px] px-3.5 py-2 rounded-xl bg-emerald-950 text-white shadow-xl text-center text-xs font-semibold break-words">
                    <span class="block text-[10px] uppercase tracking-wider text-emerald-300 font-extrabold">Responsable</span>
                    ${item.responsable}
                    <div class="w-2.5 h-2.5 bg-emerald-950 rotate-45 absolute -bottom-1 left-1/2 -translate-x-1/2"></div>
                </div>
                <div>
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold border bg-emerald-100 text-emerald-900 border-emerald-300">${item.code}</span>
                        <div class="text-[10px] font-bold text-emerald-800/90 text-right leading-tight">
                            I: ${formatDateDisplay(item.startDate)}<br>F: ${formatDateDisplay(item.endDate)}
                        </div>
                    </div>
                    <h4 class="text-xs sm:text-[13px] font-bold text-emerald-950 group-hover:text-emerald-700 leading-snug break-words mb-3">${item.referent}</h4>
                </div>
                <div class="space-y-2.5 pt-2 border-t border-emerald-100">
                    ${renderProgressBar('Esperado', item.expectedPct, 'sky')}
                    ${renderProgressBar('Completado', item.completedPct, 'emerald')}
                </div>
            </div>`;

        // --- Ventana Piramidal de Detalle ---
        const renderDetailBlock = (title, pct, color, extraHTML) => `
            <div class="pyramid-cube rounded-2xl p-5 space-y-3">
                ${renderProgressBar(title, pct, color)}
                ${extraHTML}
            </div>`;

        window.toggleWindows = showDetail => {
            DOM.main.classList.toggle('hidden', showDetail);
            DOM.detail.classList.toggle('hidden', !showDetail);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.openProductWindow = index => {
            const p = productsData.find(x => x.originalIndex === index);
            if (!p) return;

            const skipIndices = new Set([0, 1, 2, 4, 5, 9]);
            const extra = [];
            for (let i = 0; i < 11; i++) {
                if (skipIndices.has(i)) continue;
                const header = columnHeaders[i] || `Información ${i + 1}`;
                const val = p.rawRow[i];
                const displayVal = (val !== undefined && val !== null && String(val).trim() !== '') ? val : 'Sin registro';
                extra.push({ header, value: displayVal });
            }

            DOM.content.innerHTML = `
                <!-- Cima del Producto -->
                <div class="w-full max-w-md pyramid-cube rounded-2xl p-5 text-center bg-gradient-to-b from-emerald-50/90 to-white">
                    <span class="px-3 py-1 rounded-lg text-xs font-extrabold bg-emerald-100 text-emerald-900 border border-emerald-300 inline-block mb-2">${p.code}</span>
                    <h2 class="text-base sm:text-lg font-extrabold text-emerald-950 leading-snug">${p.referent}</h2>
                </div>
                <div class="w-0.5 h-4 bg-emerald-300 -my-3"></div>
                <!-- Nivel 2: Progreso y Fechas -->
                <div class="w-full max-w-2xl grid grid-cols-1 sm:grid-cols-2 gap-5">
                    ${renderDetailBlock('Progreso Esperado', p.expectedPct, 'sky', `
                        <div class="grid grid-cols-2 gap-2 text-[11px] bg-sky-50/80 p-2.5 rounded-xl border border-sky-100">
                            <div><b>Inicio:</b> ${formatDateDisplay(p.startDate)}</div>
                            <div><b>Fin:</b> ${formatDateDisplay(p.endDate)}</div>
                        </div>
                    `)}
                    ${renderDetailBlock('Progreso Completado', p.completedPct, 'emerald', `
                        <div class="grid grid-cols-2 gap-2 text-[11px] bg-emerald-50/80 p-2.5 rounded-xl border border-emerald-100">
                            <div><b>Avance:</b> ${p.completedPct}%</div>
                            <div><b>Diferencia:</b> ${p.isComplete ? '0% (Completado)' : p.lag + '%'}</div>
                        </div>
                    `)}
                </div>
                <div class="w-0.5 h-4 bg-emerald-300 -my-3"></div>
                <!-- Nivel 3: Responsable y Nombre Completo -->
                <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-5">
                    <div class="pyramid-cube rounded-2xl p-5 md:col-span-1 bg-teal-50/40">
                        <h3 class="text-xs font-bold text-teal-900 uppercase tracking-wider mb-1">Responsable</h3>
                        <p class="text-sm font-bold text-emerald-950 break-words">${p.responsable}</p>
                    </div>
                    <div class="pyramid-cube rounded-2xl p-5 md:col-span-2">
                        <h3 class="text-xs font-bold text-emerald-800 uppercase tracking-wider mb-1">Descripción Completa del Producto</h3>
                        <p class="text-sm font-medium text-emerald-950 leading-relaxed break-words">${p.fullName}</p>
                    </div>
                </div>
                <div class="w-0.5 h-4 bg-emerald-300 -my-3"></div>
                <!-- Nivel 4: Resto de atributos de la fila -->
                <div class="w-full max-w-6xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    ${extra.map(a => `
                        <div class="pyramid-cube rounded-2xl p-4">
                            <div class="text-[11px] font-bold text-emerald-800 uppercase tracking-wider mb-1">${a.header}</div>
                            <div class="text-sm text-emerald-950 bg-emerald-50/50 p-2.5 rounded-xl border border-emerald-100 break-words">${a.value}</div>
                        </div>
                    `).join('')}
                </div>`;

            toggleWindows(true);
        };

        window.onload = () => {
            renderFilters();
            loadSpreadsheetData();
        };
    </script>
</body>
</html>
